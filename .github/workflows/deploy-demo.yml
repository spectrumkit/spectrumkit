name: Deploy demo

# Builds the Vite example and publishes it to GitHub Pages as the live demo.
# Requires Pages to be enabled with "Source: GitHub Actions" in repo Settings → Pages.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build library
        run: pnpm --filter "@spectrumkit/*" build
      - name: Build Vite demo
        run: pnpm --filter with-vite build
        env:
          VITE_BASE: /spectrumkit/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples/with-vite/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
